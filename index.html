<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gtag cosmetic lookup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap');

body {
	margin:0;
	padding:0;
	background:#1b1812;
	background-image: radial-gradient(circle at 15% 0%, rgba(244,197,66,0.06), transparent 40%), radial-gradient(circle at 85% 100%, rgba(244,197,66,0.04), transparent 45%);
	color:#f1ede2;
	font-family:'Inter',sans-serif;
	min-height:100vh;
}
*{box-sizing:border-box}

.wrap{
	max-width:1100px;
	margin:0 auto;
	padding:28px 20px 60px;
}

header{
	display:flex;
	justify-content:space-between;
	align-items:flex-start;
	flex-wrap:wrap;
	gap:18px;
	border-bottom:1px solid #3a3328;
	padding-bottom:22px;
	margin-bottom:22px;
}

.title-block h1{
	font-family:'Space Grotesk',sans-serif;
	font-weight:700;
	font-size:30px;
	letter-spacing:-.01em;
	margin:0 0 4px;
}
.title-block h1 span{ color:#f4c542; }
.title-block p{
	margin:0;
	font-size:13px;
	color:#a89e89;
}
.title-block .credit{
	font-size:11px;
	color:#6e6552;
	margin-top:6px;
}
.title-block .credit a{ color:#a89e89; text-decoration:none; }

.search-area{
	display:flex;
	flex-direction:column;
	align-items:flex-end;
	gap:6px;
}
.search-box{ position:relative; width:280px; }
.search-box input{
	width:100%;
	background:#14120e;
	border:1.5px solid #3a3328;
	border-radius:10px;
	padding:11px 38px 11px 14px;
	color:#f1ede2;
	font-family:'Inter',sans-serif;
	font-size:14px;
	outline:none;
}
.search-box input::placeholder{color:#6e6552}
.search-box input:focus{
	border-color:#d9a82a;
	box-shadow:0 0 0 3px rgba(244,197,66,.15);
}
.search-box svg{
	position:absolute; right:12px; top:50%;
	transform:translateY(-50%);
	width:16px;height:16px;
	color:#6e6552;
	pointer-events:none;
}
.result-count{
	font-family:'JetBrains Mono',monospace;
	font-size:11.5px;
	color:#6e6552;
	padding-right:2px;
}
.result-count b{color:#f4c542}

#grid{
	display:grid;
	grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
	gap:12px;
}

.card{
	background:#2a251c;
	border:1px solid #3a3328;
	border-radius:12px;
	padding:14px 14px 12px;
	position:relative;
	overflow:hidden;
	cursor:pointer;
}
.card:hover{
	background:#322c21;
	border-color:#d9a82a;
}
.card::before{
	content:"";
	position:absolute;
	top:0;left:0;
	width:4px;height:100%;
	background:#f4c542;
	opacity:0;
}
.card:hover::before{opacity:1}

.card .eyebrow{
	font-family:'JetBrains Mono',monospace;
	font-size:9.5px;
	letter-spacing:.06em;
	text-transform:uppercase;
	color:#6e6552;
	margin-bottom:8px;
	white-space:nowrap;
	overflow:hidden;
	text-overflow:ellipsis;
}
.card .name{
	font-family:'Space Grotesk',sans-serif;
	font-weight:700;
	font-size:16px;
	margin-bottom:10px;
	line-height:1.25;
}
.card .tag-row{
	display:flex;
	align-items:center;
	justify-content:space-between;
	gap:8px;
}
.card .id-tag{
	font-family:'JetBrains Mono',monospace;
	font-size:12.5px;
	font-weight:600;
	color:#1b1812;
	background:#f4c542;
	border-radius:6px;
	padding:3px 9px;
}
.card.copied .id-tag{ background:#8fd19e; }
.card .wiki-btn{
	color:#6e6552;
	cursor:pointer;
	font-size:11px;
	font-family:'Inter',sans-serif;
	padding:3px 6px;
	border-radius:5px;
	text-decoration:none;
}
.card .wiki-btn:hover{ color:#f4c542; background:#14120e; }

mark{
	background:rgba(244,197,66,.35);
	color:#f1ede2;
	border-radius:3px;
	padding:0 1px;
}
.id-tag mark{
	background:#1b1812;
	color:#f4c542;
}

.empty-state{
	text-align:center;
	padding:70px 20px;
	color:#6e6552;
	font-family:'Space Grotesk',sans-serif;
	font-size:15px;
	grid-column:1/-1;
}
.empty-state .big{ font-size:34px; margin-bottom:8px; opacity:.6; }

footer{
	text-align:center;
	margin-top:36px;
	color:#6e6552;
	font-size:11.5px;
}
footer .credit{ margin-top:4px; }

@media (max-width:640px){
	header{flex-direction:column;align-items:stretch}
	.search-area{align-items:stretch}
	.search-box{width:100%}
	.title-block h1{font-size:24px}
}

.wiki-btn:focus-visible, .search-box input:focus-visible{
	outline:2px solid #f4c542;
	outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>

function esc(s){

		if(ch=='<') return '&lt;';
		if(ch=='>') return '&gt;';
		if(ch=='"') return '&quot;';
		return '&#39;';
	});
}

	var idx = lower.indexOf(q.toLowerCase());
	if(idx === -1) return esc(text);
	var before = text.slice(0, idx);
	var match = text.slice(idx, idx + q.length);
	var after = text.slice(idx + q.length);
	return esc(before) + '<mark>' + esc(match) + '</mark>' + esc(after);
}

function draw(query){
	var q = query.trim().toLowerCase();
	var matches = [];

	if(!q){
		matches = cosmeticData;
	}else{
		for(var i=0;i<cosmeticData.length;i++){
			if(cosmeticData[i].n.toLowerCase().indexOf(q) !== -1 || cosmeticData[i].i.toLowerCase().indexOf(q) !== -1){
				matches.push(cosmeticData[i]);
			}
		}
	}

	if(q){
		countEl.innerHTML = '<b>' + matches.length + '</b> match' + (matches.length===1?'':'es');
	}else{
		countEl.innerHTML = '';
	}

	if(matches.length === 0){
		grid.innerHTML = '<div class="empty-state"><div class="big">🦍</div>nothing matching "' + esc(query) + '" found</div>';
		return;
	}

	var html = '';
	for(var j=0;j<matches.length;j++){
		var d = matches[j];
		html += '<div class="card" data-id="' + esc(d.i) + '">';
		html += '<div class="eyebrow">' + esc(d.c) + '</div>';
		html += '<div class="name">' + hl(d.n, q) + '</div>';
		html += '<div class="tag-row">';
		html += '<span class="id-tag">' + hl(d.i, q) + '</span>';
		html += '<a class="wiki-btn" href="https://gorillatag.fandom.com/wiki/Special:Search?query=' + encodeURIComponent(d.n) + '" target="_blank" rel="noopener">wiki</a>';
		html += '</div></div>';
	}
	grid.innerHTML = html;
}

grid.addEventListener('click', function(e){
	if(e.target.closest('.wiki-btn')) return;
	var card = e.target.closest('.card');
	if(!card) return;
	var id = card.getAttribute('data-id');
	if(navigator.clipboard){
		navigator.clipboard.writeText(id + '.').then(function(){
			card.classList.add('copied');
			var tag = card.querySelector('.id-tag');
			var oldText = tag.textContent;
			tag.textContent = 'copied!';
			setTimeout(function(){
				tag.textContent = oldText;
				card.classList.remove('copied');
			}, 1100);
		});
	}
});

searchBox.addEventListener('input', function(){
	draw(searchBox.value);
});

draw('');
</script>
</body>
</html>

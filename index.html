<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Barkin</title>
  <link href="https://fonts.googleapis.com/css2?family=gg+sans:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    .card {
      background: #111214;
      border-radius: 16px;
      width: 300px;
      overflow: hidden;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
    }

    /* =============================================
       CUSTOMIZE: Banner — change background-color
       or swap to background-image: url('YOUR_IMG')
       ============================================= */
    .banner {
      height: 100px;
      background: #1a1a2e;
      background-image: linear-gradient(to bottom right, #0d0d1a, #1a1a2e);
      /* To use a photo: background: url('YOUR_BANNER_URL') center/cover; */
    }

    .profile-section {
      padding: 0 16px 16px;
      position: relative;
    }

    /* =============================================
       CUSTOMIZE: Avatar emoji or swap for <img>
       ============================================= */
    .avatar-wrap {
      position: relative;
      display: inline-block;
      margin-top: -36px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #5865F2;
      border: 6px solid #111214;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .online-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #23a55a;
      border: 3px solid #111214;
    }

    /* =============================================
       CUSTOMIZE: Name
       ============================================= */
    .username {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    /* =============================================
       CUSTOMIZE: Badges — add/remove emoji badges
       ============================================= */
    .badges {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 1rem;
      background: #2b2d31;
      border-radius: 6px;
      padding: 3px 5px;
    }

    /* =============================================
       CUSTOMIZE: Bio text
       ============================================= */
    .bio {
      font-size: 0.82rem;
      color: #dbdee1;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    /* Activity card */
    .activity {
      background: #2b2d31;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .activity-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #1e6fa5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .activity-text { flex: 1; min-width: 0; }

    .activity-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: #b5bac1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .activity-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .activity-detail {
      font-size: 0.75rem;
      color: #b5bac1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =============================================
       CUSTOMIZE: Social links — change href values
       ============================================= */
    .socials {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .social-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2b2d31;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      text-decoration: none;
      transition: background 0.15s, transform 0.15s;
      border: none;
      cursor: pointer;
    }

    .social-btn:hover {
      background: #3a3d44;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- CUSTOMIZE: Banner color is set in CSS above -->
    <div class="banner"></div>

    <div class="profile-section">
      <div class="avatar-wrap">
        <!-- CUSTOMIZE: Change emoji or replace with <img src="YOUR_URL"> -->
        <div class="avatar">🐱</div>
        <div class="online-dot"></div>
      </div>

      <!-- CUSTOMIZE: Your name -->
      <div class="username">hris</div>

      <!-- CUSTOMIZE: Add/remove badges -->
      <div class="badges">
        <span class="badge">💎</span>
        <span class="badge">✖️</span>
        <span class="badge">✅</span>
        <span class="badge">🔥</span>
      </div>

      <!-- CUSTOMIZE: Your bio -->
      <div class="bio">guns.lol on top</div>

      <!-- CUSTOMIZE: Activity — what you're doing -->
      <div class="activity">
        <div class="activity-icon">🎮</div>
        <div class="activity-text">
          <div class="activity-title">Playing</div>
          <div class="activity-name">Visual Studio Code</div>
          <div class="activity-detail">Editing globals.css</div>
        </div>
      </div>

      <!-- CUSTOMIZE: Social links -->
      <div class="socials">
        <a class="social-btn" href="https://yoursite.com" target="_blank" title="Website">🌐</a>
        <a class="social-btn" href="https://github.com" target="_blank" title="GitHub">🐙</a>
        <a class="social-btn" href="https://discord.com" target="_blank" title="Discord">💬</a>
      </div>
    </div>

  </div>
</body>
</html>

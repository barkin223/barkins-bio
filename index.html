<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bio</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:          #0e0e0e;
      --card:        #161616;
      --accent:      #c8f04e;
      --text:        #f0ede8;
      --muted:       #6b6b6b;
      --radius:      18px;
      --font-head:   'DM Serif Display', serif;
      --font-body:   'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      padding: 2.5rem 2rem;
      border: 1px solid #252525;
      animation: rise 0.6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .avatar-wrap { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.6rem; }
    .avatar-placeholder {
      width: 72px; height: 72px; border-radius: 50%;
      background: #2a2a2a; border: 3px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; flex-shrink: 0;
    }
    .name-block h1 { font-family: var(--font-head); font-size: 1.55rem; line-height: 1.1; letter-spacing: -0.02em; }
    .name-block .handle { color: var(--accent); font-size: 0.85rem; font-weight: 500; margin-top: 0.25rem; }
    .status {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.78rem; color: var(--muted);
      background: #1e1e1e; border: 1px solid #2a2a2a;
      border-radius: 999px; padding: 0.3rem 0.75rem; margin-bottom: 1.4rem;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .bio { font-size: 0.95rem; line-height: 1.7; color: #b0aca6; margin-bottom: 1.6rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.8rem; }
    .tag { font-size: 0.78rem; font-weight: 500; padding: 0.3rem 0.75rem; border-radius: 999px; background: #1e1e1e; border: 1px solid #2e2e2e; color: var(--muted); }
    .links { display: flex; flex-direction: column; gap: 0.6rem; }
    .link-btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1rem; border-radius: 12px;
      background: #1a1a1a; border: 1px solid #272727;
      color: var(--text); text-decoration: none;
      font-size: 0.88rem; font-weight: 500;
      transition: border-color 0.2s, background 0.2s;
    }
    .link-btn:hover { border-color: var(--accent); background: #1f1f1f; }
    .link-btn span { display: flex; align-items: center; gap: 0.6rem; }
    .link-btn .arrow { color: var(--muted); font-size: 1rem; }
    .link-btn:hover .arrow { color: var(--accent); }
    .footer { margin-top: 2rem; text-align: center; font-size: 0.75rem; color: #3a3a3a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-wrap">
      <div class="avatar-placeholder">🧑</div>
      <div class="name-block">
        <h1>Your Name</h1>
        <div class="handle">@yourhandle</div>
      </div>
    </div>
    <div class="status">
      <span class="status-dot"></span>
      Available for work
    </div>
    <p class="bio">
      Designer, developer, and creator based somewhere cool.
      I build things for the web and occasionally make art.
      Coffee-fueled, deadline-driven.
    </p>
    <div class="tags">
      <span class="tag">Design</span>
      <span class="tag">React</span>
      <span class="tag">Photography</span>
      <span class="tag">Open to collab</span>
    </div>
    <div class="links">
      <a class="link-btn" href="https://twitter.com" target="_blank">
        <span>Twitter / X</span><span class="arrow">↗</span>
      </a>
      <a class="link-btn" href="https://github.com" target="_blank">
        <span>GitHub</span><span class="arrow">↗</span>
      </a>
      <a class="link-btn" href="mailto:you@email.com">
        <span>Email me</span><span class="arrow">↗</span>
      </a>
      <a class="link-btn" href="https://yoursite.com" target="_blank">
        <span>Portfolio</span><span class="arrow">↗</span>
      </a>
    </div>
    <div class="footer">made with ♥</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>barki</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* =============================================
       CUSTOMIZE: Background — swap url() with your image
       ============================================= */
    .bg {
      position: fixed;
      inset: 0;
      background: url('https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=1200&q=80') center/cover no-repeat;
      filter: brightness(0.35) grayscale(0.6);
      z-index: 0;
    }

    /* Snowflakes */
    .snow { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .flake {
      position: absolute;
      top: -20px;
      color: rgba(255,255,255,0.7);
      font-size: 1rem;
      animation: fall linear infinite;
      user-select: none;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Main content */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }

    /* =============================================
       CUSTOMIZE: Your username
       ============================================= */
    .username {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    }

    /* Info card */
    .card {
      background: rgba(30,30,30,0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 18px 24px;
      width: 100%;
      text-align: left;
    }

    .card-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }

    .card-sub {
      font-size: 0.82rem;
      color: #aaa;
      margin-top: 2px;
    }

    /* Views */
    .views {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: #ccc;
      align-self: flex-start;
    }

    /* Music player */
    .music {
      background: rgba(30,30,30,0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 14px 18px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .music-icon {
      font-size: 1.6rem;
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .music-info { flex: 1; min-width: 0; }

    .music-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-sub { font-size: 0.75rem; color: #888; margin-top: 2px; }

    .music-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 50%;
      width: 36px; height: 36px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .music-btn:hover { background: rgba(255,255,255,0.2); }

    /* Progress bar */
    .progress-wrap {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #fff;
      border-radius: 99px;
      width: 0%;
      transition: width 1s linear;
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg"></div>

  <!-- Snow -->
  <div class="snow" id="snow"></div>

  <!-- Hidden audio — calming lo-fi music -->
  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_946f1c9925.mp3" type="audio/mpeg"/>
  </audio>

  <div class="content">

    <!-- CUSTOMIZE: Change "barki" to your name -->
    <div class="username">barki</div>

    <!-- CUSTOMIZE: Your info card -->
    <div class="card">
      <div class="card-row">
        <span style="font-size:1.2rem">🎮</span>
        <div>
          <div class="card-title">Playing Visual Studio Code</div>
          <div class="card-sub">Editing globals.css</div>
        </div>
      </div>
    </div>

    <!-- Music player -->
    <div class="music">
      <div class="music-icon">💿</div>
      <div class="music-info">
        <div class="music-title" id="song-title">Lofi Chill</div>
        <div class="music-sub">calming beats</div>
        <div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>
      </div>
      <button class="music-btn" id="play-btn" onclick="toggleMusic()">▶</button>
    </div>

    <!-- Views -->
    <div class="views">👁 0</div>

  </div>

  <script>
    // Snow
    const snow = document.getElementById('snow');
    for (let i = 0; i < 30; i++) {
      const f = document.createElement('div');
      f.className = 'flake';
      f.textContent = '❄';
      f.style.left = Math.random() * 100 + 'vw';
      f.style.fontSize = (0.6 + Math.random() * 0.8) + 'rem';
      f.style.animationDuration = (6 + Math.random() * 10) + 's';
      f.style.animationDelay = (Math.random() * 10) + 's';
      f.style.opacity = 0.4 + Math.random() * 0.5;
      snow.appendChild(f);
    }

    // Music
    const audio = document.getElementById('music');
    const btn = document.getElementById('play-btn');
    const bar = document.getElementById('progress');
    let playing = false;

    function toggleMusic() {
      if (playing) {
        audio.pause();
        btn.textContent = '▶';
      } else {
        audio.play();
        btn.textContent = '⏸';
      }
      playing = !playing;
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        bar.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    });

    // Autoplay on first click anywhere
    document.addEventListener('click', () => {
      if (!playing) toggleMusic();
    }, { once: true });
  </script>

</body>
</html>
